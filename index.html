<style>
:root{--ink:#0b1f2a;--mute:#3d5866;--glass:rgba(255,255,255,.72);--edge:rgba(255,255,255,.95);--opt:rgba(255,255,255,.55);--bg1:#d9f7f4;--bg2:#4fb7c9;--bg3:#0e6f8f;--ok:#0d9f8a;--onok:#fff;--okbg:rgba(20,184,166,.25);--bad:#c2410c;--wave:rgba(255,255,255,.3);--lf:none;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eaf7fa;--mute:#a7c6d0;--glass:rgba(8,22,30,.66);--edge:rgba(120,220,230,.3);--opt:rgba(255,255,255,.06);--bg1:#010305;--bg2:#05303d;--bg3:#0a7f94;--ok:#2dd4bf;--onok:#012a27;--okbg:rgba(45,212,191,.22);--bad:#fb923c;--wave:rgba(45,212,191,.16);--lf:brightness(0) invert(1)}}
:root[data-theme="dark"]{--ink:#eaf7fa;--mute:#a7c6d0;--glass:rgba(8,22,30,.66);--edge:rgba(120,220,230,.3);--opt:rgba(255,255,255,.06);--bg1:#010305;--bg2:#05303d;--bg3:#0a7f94;--ok:#2dd4bf;--onok:#012a27;--okbg:rgba(45,212,191,.22);--bad:#fb923c;--wave:rgba(45,212,191,.16);--lf:brightness(0) invert(1)}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:linear-gradient(165deg,var(--bg1),var(--bg2) 55%,var(--bg3));color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
.wave{position:fixed;left:0;bottom:0;width:200%;height:34vh;animation:w 26s linear infinite;pointer-events:none}
.wave.b{height:26vh;animation-duration:17s;animation-direction:reverse;opacity:.7}
.wave path{fill:var(--wave)}
@keyframes w{to{transform:translateX(-50%)}}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
.top{display:flex;gap:14px;align-items:center;padding:14px 20px}
#cnt{min-width:4.5em;font-weight:700;color:var(--ink)}
.bar{flex:1;height:6px;border-radius:9px;background:var(--edge);overflow:hidden}
#prog{display:block;height:100%;width:0;background:var(--ok);transition:width .5s}
main{flex:1;overflow-y:auto;padding:8px 18px 18px}
.card{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--edge);border-radius:28px;box-shadow:0 12px 40px rgba(0,50,70,.22),inset 0 1px 0 rgba(255,255,255,.6);padding:clamp(18px,3vmin,38px);margin:0 auto 16px;max-width:980px}
h1{font-size:clamp(30px,6vmin,68px);line-height:1.05;margin:.2em 0 .3em;letter-spacing:-.02em}
h2{font-size:clamp(22px,3.4vmin,42px);line-height:1.2;margin:0 0 .6em;letter-spacing:-.01em}
h3{font-size:clamp(14px,1.6vmin,18px);color:var(--mute);margin:1em 0 .3em}
p{font-size:clamp(16px,2vmin,24px);line-height:1.5;margin:.4em 0}
.kick{color:var(--mute);font-weight:600}.ref{font-weight:700}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 18px;margin:10px 0;border-radius:18px;border:1.5px solid var(--edge);background:var(--opt);color:inherit;font:inherit;font-size:clamp(16px,2.2vmin,28px);cursor:pointer;transition:all .35s}
.opt b{flex:none;width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:rgba(20,140,160,.22);font-size:.8em}
.sel{border-color:var(--ok);box-shadow:0 0 0 3px var(--okbg)}
.ok{border-color:var(--ok);background:var(--okbg);transform:scale(1.02);box-shadow:0 0 28px var(--okbg);font-weight:700}
.bad{border-color:var(--bad)}.dim{opacity:.4}
.in .card:first-child{animation:up .5s ease-out}.ev{animation:up .5s ease-out}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.nav{display:flex;gap:12px;justify-content:center;padding:10px 16px;position:absolute;left:0;right:0;bottom:var(--tickh,64px);z-index:5;transition:opacity .4s}.nav.hide{display:none}
button{font:inherit}
.btn{padding:14px 28px;border-radius:999px;border:1px solid var(--edge);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--ink);font-size:clamp(16px,2vmin,22px);font-weight:700;cursor:pointer}
.btn.pri{background:var(--ok);color:var(--onok);border-color:transparent}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
#tm{padding:2px 24px;font-size:clamp(36px,8vmin,96px);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;min-width:4.4em;letter-spacing:.02em}#tm.warn{color:var(--bad);border-color:var(--bad)}#tm.done{background:var(--bad);color:#fff;border-color:transparent;animation:pl 1s infinite}@keyframes pl{50%{opacity:.55}}
.corner{position:fixed;width:clamp(120px,18vmin,260px);opacity:.12;pointer-events:none;z-index:0;transition:opacity .6s}#c1{left:2vmin;top:12vh}#c2{right:2vmin;bottom:14vh;filter:var(--lf)}body.st .corner{opacity:0}.lgs{display:flex;gap:clamp(20px,5vmin,60px);align-items:center;justify-content:center;margin-bottom:.8em}.lg{height:clamp(80px,16vmin,170px)}.sda{filter:var(--lf)}
@media (min-width:900px) and (orientation:landscape){main.two{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start;max-width:1500px;margin:0 auto;width:100%;box-sizing:border-box}main.two .card{max-width:none;margin:0}}
.tick{overflow:hidden;white-space:nowrap;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--edge);padding:12px 0}.tk{display:inline-block;padding-left:100%;font-size:clamp(16px,2.2vmin,28px);font-weight:600;animation:tk 50s linear infinite}@keyframes tk{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.tk{padding-left:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<div class="tick" aria-hidden="true"><div class="tk">Bible Challenge  •  Akiwasilisha: Mr. Alson  •  “Jaribuni mambo yote; lishikeni lililo jema.” — 1 Wathesalonike 5:21  •  Biblia ndiyo msingi wa majibu  •  Karibuni sote!</div></div>

<script>
const Q=[{"n": 1, "q": "Je, mtu aliyekufa anaendelea kuishi na kujua yanayotokea duniani?", "o": ["Ndiyo, anaendelea kutuona", "Hapana, wafu hawajui neno lolote", "Anaishi duniani kama roho", "Anarudi kwa familia yake mara kwa mara"], "a": "B", "r": "Mhubiri 9:5, 6, 10; Zaburi 146:4; Yohana 11:11–14.", "e": "Mhubiri anaeleza kuwa wafu hawajui yanayotendeka na shughuli zao hukoma. Yesu pia alilinganisha kifo cha Lazaro na usingizi. Soma maandiko yote katika muktadha wake.", "w": "Ellen G. White, The Great Controversy, sura 33: “The First Great Deception”; sura 34: “Can Our Dead Speak to Us?”"}, {"n": 2, "q": "Yesu aliposema, “Mimi ndimi Bwana wa Sabato,” alimaanisha nini?", "o": ["Sabato ilifutwa", "Jumapili ndiyo Sabato", "Yeye ndiye mwenye mamlaka juu ya Sabato", "Sabato ilikuwa kwa Wayahudi pekee"], "a": "C", "r": "Marko 2:27–28; Mwanzo 2:2–3; Kutoka 20:8–11.", "e": "Yesu alisema Sabato ilifanywa kwa ajili ya mwanadamu. Mwanzo 2 inaonyesha Sabato ilibarikiwa wakati wa uumbaji. Marko 2:28 inamtaja Yesu kuwa Bwana wa Sabato.", "w": "Ellen G. White, The Desire of Ages, sura 29: “The Sabbath.”"}, {"n": 3, "q": "Ni kipi kinapaswa kuwa kipimo cha mwisho cha mafundisho ya kiroho?", "o": ["Mchungaji", "Kitabu cha dhehebu", "Mtu mwenye maono", "Neno la Mungu"], "a": "D", "r": "Isaya 8:20; 2 Timotheo 3:16–17; Matendo 17:11.", "e": "Waberoya walichunguza Maandiko ili kuthibitisha walichofundishwa. Hivyo mafundisho, uzoefu na madai ya ufunuo yanapaswa kupimwa kwa Biblia.", "w": "Ellen G. White, The Great Controversy, Introduction; Selected Messages, Book 1."}, {"n": 4, "q": "Je, mwanadamu ana nafsi isiyoweza kufa kwa asili yake?", "o": ["Ndiyo, kila mtu ana nafsi isiyokufa", "Hapana, Mungu pekee ndiye mwenye kutokufa kwa asili", "Waovu pekee ndio hawafi", "Biblia inasema hakuna uzima baada ya kifo"], "a": "B", "r": "1 Timotheo 6:15–16; Warumi 6:23; Ezekieli 18:4; 1 Wakorintho 15:51–54.", "e": "1 Timotheo humweleza Mungu kuwa mwenye kutokufa. Warumi 6:23 huita uzima wa milele zawadi ya Mungu, na 1 Wakorintho 15 huunganisha kutokufa na ufufuo.", "w": "Ellen G. White, The Great Controversy, sura 33–34."}, {"n": 5, "q": "Nani ndiye mpatanishi mmoja kati ya Mungu na wanadamu?", "o": ["Ellen G. White", "Mchungaji wa kanisa", "Yesu Kristo", "Malaika Gabrieli"], "a": "C", "r": "1 Timotheo 2:5; Waebrania 7:25; 1 Yohana 2:1.", "e": "1 Timotheo inamtaja Yesu Kristo kuwa mpatanishi mmoja. Waebrania 7 inaeleza kuwa anaishi daima kuwaombea wanaomkaribia Mungu kupitia yeye.", "w": "Ellen G. White, The Great Controversy, sura zinazohusu huduma ya Kristo katika patakatifu pa mbinguni; The Desire of Ages."}, {"n": 6, "q": "Mwanadamu anaokolewa kwa matendo mema au kwa neema kupitia imani?", "o": ["Kwa matendo pekee", "Kwa neema kupitia imani", "Kwa kushika Sabato pekee", "Kwa kutoa sadaka nyingi"], "a": "B", "r": "Waefeso 2:8–10; Warumi 3:28; Yakobo 2:17; Tito 3:5.", "e": "Waefeso 2:8–9 inasema wokovu ni kwa neema kupitia imani, si kwa matendo. Mstari wa 10 unaonyesha kuwa waliookolewa wameumbwa kwa ajili ya matendo mema. Yakobo anaonyesha imani hai huzaa matendo.", "w": "Ellen G. White, Steps to Christ, sura 7: “The Test of Discipleship”; Faith and Works."}, {"n": 7, "q": "Manabii wanaojitokeza wanapaswa kupimwa kwa msingi gani?", "o": ["Umaarufu wao", "Miujiza pekee", "Uwezo wa kutabiri pekee", "Kulinganisha mafundisho na Biblia na kupima matunda"], "a": "D", "r": "1 Yohana 4:1; Mathayo 7:15–20; Isaya 8:20; Kumbukumbu la Torati 18:21–22.", "e": "Biblia inaagiza kuzijaribu roho. Yesu alisema manabii wa uongo hutambuliwa kwa matunda yao. Miujiza au umaarufu pekee si uthibitisho wa kutosha.", "w": "Ellen G. White, The Great Controversy, Introduction; Testimonies for the Church, Vol. 5."}, {"n": 8, "q": "Je, waovu wataendelea kuteseka milele bila kuangamizwa?", "o": ["Ndiyo, wataishi milele katika mateso", "Hapana, mwisho wao ni uharibifu wa mwisho", "Wote watapewa nafasi nyingine baada ya hukumu", "Hakuna hukumu ya mwisho"], "a": "B", "r": "Malaki 4:1–3; Warumi 6:23; Ufunuo 20:9, 14–15; Yohana 3:16.", "e": "Maandiko haya yanazungumzia mauti ya pili na kuangamizwa kwa waovu. Mathayo 25:46 hutaja “adhabu ya milele”; mjadala unapaswa kutofautisha matokeo ya milele na kitendo kinachoendelea milele.", "w": "Ellen G. White, The Great Controversy, sura 33: “The First Great Deception”; sura 42: “The Controversy Ended.”"}, {"n": 9, "q": "Maandishi ya Ellen G. White yana nafasi gani yakilinganishwa na Biblia?", "o": ["Yana mamlaka kubwa kuliko Biblia", "Yanaweza kuibatilisha Biblia", "Biblia ndiyo kipimo cha mwisho; maandishi yake yapimwe kwa Biblia", "Biblia haihitajiki tena"], "a": "C", "r": "2 Timotheo 3:16–17; Isaya 8:20; 1 Wathesalonike 5:20–21; 1 Yohana 4:1.", "e": "Maandiko yanaagiza kupima mafundisho na kuchunguza kila jambo. Kwa hiyo hakuna maandishi ya mwanadamu yanayopaswa kuchukua nafasi ya Biblia au kupingana nayo.", "w": "Ellen G. White, The Great Controversy, Introduction; Selected Messages, Book 1; Testimonies for the Church, Vol. 5."}, {"n": 10, "q": "Yesu alifufuka siku gani kulingana na simulizi za Injili?", "o": ["Ijumaa", "Jumamosi", "Siku ya kwanza ya juma", "Alhamisi"], "a": "C", "r": "Mathayo 28:1–6; Marko 16:1–6; Luka 24:1–7; Yohana 20:1.", "e": "Injili zinasema wanawake walifika kaburini siku ya kwanza ya juma na kukuta Yesu amefufuka. Tukio hilo peke yake halisemi kwamba Sabato ya siku ya saba ilibadilishwa.", "w": "Ellen G. White, The Desire of Ages, sura 81: “The Lord Is Risen”; sura 82: “Why Weepest Thou?”"}, {"n": 11, "q": "Je, Yesu Kristo ni Mungu wa kweli au ni kiumbe aliyeumbwa?", "o": ["Ni malaika mkuu aliyeumbwa", "Ni Mungu wa kweli; Neno aliyekuwako tangu mwanzo", "Alianza kuwepo alipozaliwa Bethlehemu", "Ni nabii tu"], "a": "B", "r": "Yohana 1:1–3, 14; Yohana 20:28; Wakolosai 2:9; Waebrania 1:8.", "e": "Yohana 1:1 humtaja Neno kuwa Mungu, na Yohana 1:14 husema Neno alifanyika mwili. Tomaso alimwita Yesu “Bwana wangu na Mungu wangu” (Yohana 20:28).", "w": "Ellen G. White, The Desire of Ages, sura 1: “God With Us”; Evangelism, sehemu inayohusu uungu wa Kristo."}, {"n": 12, "q": "Je, Yesu alikuwepo kabla ya kuzaliwa kwake Bethlehemu?", "o": ["Hapana, alianza kuwepo Bethlehemu", "Ndiyo, alikuwepo kabla ya Ibrahimu na kabla ya uumbaji", "Alianza kuwepo baada ya Yohana Mbatizaji", "Biblia haisemi"], "a": "B", "r": "Yohana 8:58; Yohana 17:5; Mika 5:2; Wakolosai 1:16–17.", "e": "Yesu alisema, “Kabla Ibrahimu hajakuwako, mimi niko.” Yohana 17:5 inazungumzia utukufu aliokuwa nao pamoja na Baba kabla ya ulimwengu kuwako.", "w": "Ellen G. White, The Desire of Ages, sura 1: “God With Us”; Patriarchs and Prophets, sura 1."}, {"n": 13, "q": "Biblia inafundisha nini kuhusu Baba, Mwana na Roho Mtakatifu?", "o": ["Ni mtu mmoja anayebadilisha majina", "Ni miungu watatu tofauti", "Baba, Mwana na Roho Mtakatifu wanatajwa pamoja katika umoja wa Mungu", "Roho Mtakatifu si sehemu ya Uungu"], "a": "C", "r": "Kumbukumbu la Torati 6:4; Mathayo 28:19; 2 Wakorintho 13:14; Waefeso 4:4–6.", "e": "Mathayo 28:19 hutaja jina moja (umoja) la Baba, Mwana na Roho Mtakatifu. Biblia haitumii neno “Utatu” moja kwa moja, lakini maandiko haya ni msingi wa mafundisho ya Utatu katika Ukristo wa SDA.", "w": "Ellen G. White, The Desire of Ages, sura 73: “Let Not Your Heart Be Troubled”; Evangelism, sehemu kuhusu Uungu wa nafsi tatu."}, {"n": 14, "q": "Je, Roho Mtakatifu ni nguvu tu au ni nafsi ya Kiungu?", "o": ["Ni nguvu isiyo na nafsi", "Ni malaika", "Ni nafsi ya Kiungu anayefundisha, kuongoza na kusema", "Ni hisia za mwanadamu"], "a": "C", "r": "Yohana 14:16–17, 26; Yohana 16:13; Matendo 5:3–4; Waefeso 4:30.", "e": "Roho Mtakatifu hufundisha na kukumbusha (Yohana 14:26), huongoza katika kweli (Yohana 16:13), na anaweza kuhuzunishwa (Waefeso 4:30). Matendo 5:3–4 yanaunganisha kumdanganya Roho Mtakatifu na kumdanganya Mungu.", "w": "Ellen G. White, The Acts of the Apostles, sura 5: “The Gift of the Spirit”; The Desire of Ages, sura 73."}, {"n": 15, "q": "Je, Yesu na Baba ni kitu kimoja kwa maan let i=-1,rev=false,pick=null;
const $=s=>document.querySelector(s),m=$('#main'),N=Q.length;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(fresh){
 const q=Q[i],inQ=i>=0&&i<N;
 $('#back').hidden=i<0;$('#ans').hidden=!inQ;$('#ans').disabled=rev;$('#next').hidden=i>=N;
 $('#next').textContent=i<0?'Anza ›':'Next ›';
 $('#cnt').textContent=inQ?(i+1)+' / '+N:'';
 $('#prog').style.width=Math.min(i+1,N)/N*100+'%';
 m.className=fresh?'in':'';document.body.classList.toggle('st',i<0);if(rev)m.classList.add('two');
 if(i<0){m.innerHTML='<section class="card"><div class="lgs"><img class="lg" src="'+L1+'" alt="PCM"><img class="lg sda" src="'+L2+'" alt="Kanisa la Waadventista"></div><p class="kick">Maswali 15 ya kuchagua</p><h1>Je, unaijua imani ya SDA?</h1><p>Biblia na marejeo ya Ellen G. White.</p><p class="kick">Msingi wa majibu ni Biblia. Vitabu vya Ellen G. White ni marejeo ya ziada.</p></section>';return}
 if(i>=N&&done){m.innerHTML='<section class="card" style="text-align:center"><p class="kick">Bible Challenge</p><h1>Mungu awabariki nyote!</h1><p>Asanteni kwa kushiriki. Tunawatakia baraka tele katika wiki inayokuja.</p><h1>Sabato njema!</h1></section>';return}
 if(i>=N){m.innerHTML='<section class="card"><p class="kick">Hitimisho</p><h1>“Jaribuni mambo yote; lishikeni lililo jema.”</h1><p class="ref">1 Wathesalonike 5:21</p><p>Lengo si kushinda mabishano, bali kuchunguza Maandiko kwa uaminifu, kuelewa imani na kujibu kwa upendo na heshima.</p><p><button class="btn pri" id="fin">Finish</button></p></section>';return}
 let h='<section class="card"><p class="kick">Swali '+q.n+'</p><h2>'+esc(q.q)+'</h2>';
 q.o.forEach((t,k)=>{const L='ABCD'[k];let c='';
  if(rev)c=L==q.a?'ok':(L==pick?'bad':'dim');else if(L==pick)c='sel';
  h+='<button class="opt '+c+'" data-l="'+L+'"><b>'+L+'</b><span>'+esc(t)+'</span></button>'});
 h+='</section>';
 if(rev)h+='<section class="card ev"><h3>Ushahidi wa Biblia</h3><p class="ref">'+esc(q.r)+'</p><p>'+esc(q.e)+'</p><h3>Rejea ya Ellen G. White</h3><p>'+esc(q.w)+'</p></section>';
 m.innerHTML=h;
 if(rev)m.scrollTo({top:m.scrollHeight,behavior:'smooth'});
}
const TOTAL=900;let left=TOTAL,end=0,tick=null;
function showT(){const s=Math.max(0,Math.ceil(left));const t=$('#tm');t.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+(!tick&&s>0&&s<TOTAL?' ⏸':'');t.className=s<=0?'btn done':s<=120?'btn warn':'btn'}
function stopT(){clearInterval(tick);tick=null}
function startT(){if(tick||left<=0)return;end=Date.now()+left*1000;tick=setInterval(()=>{left=Math.max(0,(end-Date.now())/1000);if(left<=0)stopT();showT()},250);showT()}
function resetT(){stopT();left=TOTAL;showT()}
$('#tm').onclick=()=>{if(tick){left=(end-Date.now())/1000;stopT();showT()}else startT()};
let done=false;function fin(){done=true;render(true)}
function go(d){if(i>=N&&d>0)return;done=false;if(i==-1&&d==1)startT();i=Math.max(-1,Math.min(N,i+d));if(i>=N){left=tick?(end-Date.now())/1000:left;stopT();showT()}rev=false;pick=null;render(true);m.scrollTop=0}
function reveal(){if(i>=0&&i<N&&!rev){rev=true;render()}}
$('#next').onclick=()=>go(1);$('#back').onclick=()=>go(-1);$('#ans').onclick=reveal;
m.onclick=e=>{const o=e.target.closest('.opt');
 if(o&&!rev){pick=o.dataset.l;render()}
 if(e.target.id=='fin')fin()};
document.onkeydown=e=>{
 if(e.key==' '||e.key=='ArrowRight'||e.key=='PageDown'){e.preventDefault();if(i>=N){if(!done)fin()}else if(i>=0&&!rev)reveal();else go(1)}
 else if(e.key=='ArrowLeft'||e.key=='PageUp'){e.preventDefault();go(-1)}};
$('#th').onclick=()=>{const d=document.documentElement;
 const dark=d.dataset.theme?d.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;
 d.dataset.theme=dark?'light':'dark'};
const nav=$('.nav');let hideT;
function showNav(){nav.classList.remove('hide');clearTimeout(hideT);hideT=setTimeout(()=>nav.classList.add('hide'),3000)}
function fit(){document.documentElement.style.setProperty('--tickh',$('.tick').offsetHeight+'px')}
addEventListener('resize',fit);
let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<60){if(dx<0){if(i>=N){if(!done)fin()}else if(i>=0&&!rev)reveal();else go(1)}else go(-1)}},{passive:true});
nav.classList.add('hide');fit();
$('#c1').src=L1;$('#c2').src=L2;render(true);showT();
</script></body></html>
